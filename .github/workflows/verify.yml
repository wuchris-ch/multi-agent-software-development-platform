name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: 0.9.16
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Prepare coding image
        run: |
          docker build -t swe-platform-codex:local -f containers/codex.Dockerfile containers
          echo "SWE_PLATFORM_CODING_IMAGE=$(docker image inspect swe-platform-codex:local --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: uv run pytest -q
      - run: uv build
      - name: Installed wheel smoke
        run: |
          uv venv /tmp/swe-wheel-env --python 3.12
          uv pip install --python /tmp/swe-wheel-env/bin/python dist/*.whl
          cd /tmp
          /tmp/swe-wheel-env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
