[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swe-platform"
version = "0.1.0"
description = "Durable local software development jobs with inspectable evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "typer>=0.19,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
swe-platform = "swe_platform.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
artifacts = ["src/swe_platform/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/swe_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
